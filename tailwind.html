<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        /* @theme {
        --color-clifford: #fff;
      } */
    </style>
</head>

<body>
    <header>

    </header>
    <main class="max-w-3/4 m-auto">
        <h1 class="text-3xl font-bold underline my-8 text-pink-500">
            Hello world!
        </h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-blue-500 p-6 text-white rounded">1. kolonna</div>
            <div class="bg-green-500 p-6 text-white rounded">2. kolonna</div>
            <div class="bg-red-500 p-6 text-white rounded">3. kolonna</div>
        </div>
        <div class="flex flex-wrap gap-4 mt-5">
            <div class="flex-1 bg-blue-200 p-4">1. kolonna</div>
            <div class="flex-1 bg-green-200 p-4">2. kolonna</div>
            <div class="flex-1 bg-red-200 p-4">3. kolonna</div>
        </div>

        <section id="galerija">
            <div class="container mx-auto px-4 py-8">
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">

                    <div class="overflow-hidden rounded-lg shadow-md group aspect-square">
                        <img src="https://images.pexels.com/photos/1563356/pexels-photo-1563356.jpeg?auto=compress&cs=tinysrgb&w=600"
                            alt="Daba"
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            tabindex="0">
                    </div>

                    <div class="overflow-hidden rounded-lg shadow-md group aspect-square">
                        <img src="https://images.pexels.com/photos/247599/pexels-photo-247599.jpeg?auto=compress&cs=tinysrgb&w=600"
                            alt="Arhitektūra"
                            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            tabindex="0">
                    </div>

                    <div class="overflow-hidden rounded-lg shadow-md group aspect-square">
                        <img src="https://images.pexels.com/photos/1271619/pexels-photo-1271619.jpeg?auto=compress&cs=tinysrgb&w=600"
                            alt="Cilvēks"
                            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            tabindex="0">
                    </div>

                    <div class="overflow-hidden rounded-lg shadow-md group aspect-square">
                        <img src="https://images.pexels.com/photos/1108099/pexels-photo-1108099.jpeg?auto=compress&cs=tinysrgb&w=600"
                            alt="Dzīvnieks"
                            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            tabindex="0">
                    </div>

                    <div class="overflow-hidden rounded-lg shadow-md group aspect-square">
                        <img src="https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=600"
                            alt="Ēdiens"
                            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            tabindex="0">
                    </div>

                    <div class="overflow-hidden rounded-lg shadow-md group aspect-square">
                        <img src="https://images.pexels.com/photos/33109/fall-autumn-red-season.jpg?auto=compress&cs=tinysrgb&w=600"
                            alt="Gadalaiks"
                            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            tabindex="0">
                    </div>

                    <div class="overflow-hidden rounded-lg shadow-md group aspect-square">
                        <img src="https://images.pexels.com/photos/2599244/pexels-photo-2599244.jpeg?auto=compress&cs=tinysrgb&w=600"
                            alt="Tekstūra"
                            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            tabindex="0">
                    </div>

                    <div class="overflow-hidden rounded-lg shadow-md group aspect-square">
                        <img src="https://images.pexels.com/photos/1037992/pexels-photo-1037992.jpeg?auto=compress&cs=tinysrgb&w=600"
                            alt="Abstrakcija"
                            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            tabindex="0">
                    </div>

                    <div class="overflow-hidden rounded-lg shadow-md group aspect-square">
                        <img src="https://images.pexels.com/photos/1619317/pexels-photo-1619317.jpeg?auto=compress&cs=tinysrgb&w=600"
                            alt="Pilsēta"
                            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            tabindex="0">
                    </div>

                    <div class="overflow-hidden rounded-lg shadow-md group aspect-square">
                        <img src="https://images.pexels.com/photos/147411/italy-mountains-dawn-daybreak-147411.jpeg?auto=compress&cs=tinysrgb&w=600"
                            alt="Ceļojums"
                            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            tabindex="0">
                    </div>

                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 flex items-center justify-center">
            <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">

                <div class="text-center">
                    <h2 class="text-3xl font-extrabold text-gray-900">Sazinies ar mums</h2>
                    <p class="mt-2 text-sm text-gray-600">Mēs atbildēsim 24 stundu laikā.</p>
                </div>

                <form class="mt-8 space-y-6" action="#" method="POST">
                    <div class="grid grid-cols-1 gap-y-4">

                        <div>
                            <label for="full-name" class="block text-sm font-medium text-gray-700">Vārds Uzvārds</label>
                            <input type="text" name="full-name" id="full-name" autocomplete="name" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 focus-visible:ring-pink-500 focus-visible:border-pink-500 
                                focus:outline-none
                                transition duration-200" placeholder="Jānis Bērziņš">
                        </div>

                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700">E-pasta adrese</label>
                            <input type="email" name="email" id="email" autocomplete="email" required
                                class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                                placeholder="janis@piemērs.lv">
                        </div>

                        <div>
                            <label for="message" class="block text-sm font-medium text-gray-700">Tava ziņa</label>
                            <textarea id="message" name="message" rows="4" required
                                class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                                placeholder="Kā mēs varam Tev palīdzēt?"></textarea>
                        </div>
                    </div>

                    <div>
                        <button type="submit"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300 transform hover:-translate-y-1">
                            Nosūtīt ziņu
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </footer>
</body>

</html>
