<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            font-size: 16px;
            /* Sākotnējo atkāpju atiestatīšana */
        }

        .container {
            display: flex;
            width: 65%;
            margin: auto;
            gap: 50px;
        }



        .team img {
            width: 100%;
        }

        .team p {
            padding: 10px;
            text-align: center;
        }

        .team h3 {
            /* padding: 10px; */
            text-align: center;
            font-size: 2rem;
        }

        .team h5 {
            /* padding: 10px; */
            text-align: center;
            font-size: 1.2rem;
        }

       .team .col {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 10px 10px rgba(128, 128, 128, 0.489);
            padding-bottom: 20px;
            background: white;
            /* margin:20px */
        }


        .background1 {
            position: absolute;
            width: 100%;
            height: 400px;
            background-color: #863EF4;
            top: 0px;
            z-index: -1;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
        }

        .big_title {
            font-size: 5rem;
            text-align: center;
            font-weight: 100;
            margin: 50px 0px;
            color: white;
        }






        .contacts{
            margin-top:150px;


            .image img{
                width: 100%;
                clip-path: inset(11% 0 0 0);
                transform: translate(0px, -46px);

            }
             .image{
                width: 50%;
             }
             .form{
                width: 50%;
             }

            .big_title{
                color: #863EF4;
                font-size: 2rem;
                font-weight: 900;
                margin-top:20px;
                margin-bottom:20px;
            }

            p{
                padding: 10px 20px;
                text-align: center;
            }


            form{
                display: flex;
                flex-direction: column;
                
                input,textarea,button{
                    font-size: 16px;
                    padding: 5px 10px;
                    margin-bottom: 20px;
                    border:1px solid #863EF4;
                    border-radius: 5px;
                }
                textarea{
                    height: 250px;
                }

                button{
                    background-color: #863EF4;
                    color:white;
                }

            }

        }



        /* Adaptīvais dizains */

        @media screen and (max-width:760px){

            .big_title{
                font-size: 3.5rem;
            }

            .container{
                flex-direction: column;
                gap: 10px;
            }

            .contacts{
                .col{
                    width:90%;
                    margin: auto;
                }

            }
        }



        .izcelts1{
            color:red;
            transform: rotate(10deg);
            transition: 1s;
        }
        .izcelts2{
            color:rgb(0, 255, 85);
            transform: rotate(-10deg);
        }

        .overlay{
            position: fixed;
            top:10px;
            right:20px;
            width:300px;
            height:300px;
            padding: 20px;
            box-shadow: 0px 0px 10px black;
            background-color: #863EF4;
        }


    .languages{
        float: right;
        padding: 30px;
    }
    </style>
</head>

<body>
    <section>
        <button class="settings_btn">Settings</button>
        <div class="languages">
            <button class="btn btn_lv">LV</button>
            <button class="btn btn_en">EN</button>
        </div>

        <h1 class="big_title">
            <span lang="lv">Mūsu komanda</span>
            <span lang="en">Our Team</span>
        </h1>
        <div class="container team">
            <div class="col">
                <img src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="">
                <p>
                    <span lang="lv">Labs speciālists IT jomā</span>
                    <span lang="en">Good IT specialist</span>
                </p>
                <h3>Jānis Baltiņš</h3>
                <h5>
                    <span lang="lv">Direktors</span>
                    <span lang="en">Director</span>
                    
                </h5>
            </div>
            <div class="col">
                <img src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="">
                <p>Labs speciālists IT jomā</p>
                <h3>Jānis Baltiņš</h3>
                <h5>Direktors</h5>
            </div>
            <div class="col">
                <img src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="">
                <p>Labs speciālists IT jomā</p>
                <h3>Jānis Baltiņš</h3>
                <h5>Direktors</h5>
            </div>
        </div>

    </section>


    <section class="contacts">
           
        <div class="container">
            <div class="col image">
                 <img src="https://img.freepik.com/free-photo/group-graphic-designers-using-digital-tablet_1170-772.jpg?semt=ais_hybrid&w=740&q=80" alt="">   
            </div>
            <div class="col form">
                 <h1 class="big_title">Mūsu kontakti</h1>
                 <p>Šajā lapā atradīsiet mūsu kontaktformu</p>

                 <form action="" class="contactForm">
                    <input type="text" name="" id=""    placeholder="Jūsu vārds">
                    <input type="email" name="" id=""    placeholder="Jūsu ēpasts">
                    <textarea name="" id="" placeholder="Ziņa"></textarea>
                    <button type="submit">Nosūtīt ziņu</button>
                 </form>
            </div>

        </div>


    </section>

    <!-- Dizaina elementi -->
    <div class="background1"></div>


    <div class="overlay">
        <input type="text" name="" id="document_name">
    </div>



    <script>
        $(function(){

        // elementu atlase no lapas

        // $('.big_title').css("color","red");
        $('.big_title').css({
            textDecoration:"underline",
            fontSize:"50pt"
        });
         $('.big_title').hide();
         $('.big_title').show();
         $('.big_title').fadeOut();
         $('.big_title').fadeIn();
         $('.big_title').slideUp();
         $('.big_title').slideDown();
        //  $('.big_title').slideToggle();

        //   $('.big_title').animate({
        //     fontSize:"30pt",
        //     color:"red",
        //     transform:"rotate(360deg)"
        //   },2000).fadeOut(5000)


        //   Manipulācija ar CSS klasēm

        $('.big_title')
            .addClass("izcelts1")
            .addClass("izcelts2")
            .removeClass("izcelts1")
            .toggleClass("izcelts1")


         $('.big_title').click(function(){
            $('body').css({
                backgroundImage:"linear-gradient(blue,red)"
            })
         })

         $('.team img').mouseover(function(){
             $('.big_title').css("transform","scale(0.5)")

         })
         $('.team img').mouseleave(function(){
             $('.big_title').css("transform","scale(1)")
         })




         $('.overlay').hide();
         $('.settings_btn').click(function(){
              $('.overlay').slideToggle(500)  
         })
         $('#document_name').keyup(function(){
            teksts =  $(this).val()
            $('.big_title').text(teksts)
            $('title').text(teksts)

         })

         $('.team h3').dblclick(function(){
            html = "<h1>Jauns lietotājs</h1>"
           $(this).html(html)
           
         })



        //  Elementu atribūtu maiņa

        $('img').mouseover(function(){
                src = $(this).attr("src");
              $('body').css("background-image",`url(${src})`)
        })

        $('img').mouseleave(function(){
                src = "";
              $('body').css("background-image",`url(${src})`)
        })





        $(document).on('mousemove', function(e) {
                // e.pageX - horizontālā pozīcija no lapas kreisās malas
                // e.pageY - vertikālā pozīcija no lapas augšas
                
                let x = e.pageX;
                let y = e.pageY;

                x = e.pageX-731;
                y = e.pageY-350;

                $('body').css("background-position",`${x/10}px ${y/10}px`)

                console.log("X: " + x + ", Y: " + y);
                
                // Piemērs: parādām koordinātas kādā elementā
                // $('.big_title').text(`X: ${x}, Y: ${y}`);
        });


        // Valodas

        $('.btn_lv').click(function(){
            $("span:lang(en)").hide();
            $("span:lang(lv)").show();
            localStorage.setItem("lang","lv")
        })
        $('.btn_en').click(function(){
            $("span:lang(en)").show();
            $("span:lang(lv)").hide();
             localStorage.setItem("lang","en")
        })

        // lang = localStorage.getItem("lang");
        // if(lang){
        //     $('.btn_'+lang)
        // }else{
        //     $('.btn_lv').click();
        // }

       lang = localStorage.getItem("lang")?localStorage.getItem("lang"):"lv";

        $('.btn_'+lang).click();

    });



    </script>
</body>

</html>
