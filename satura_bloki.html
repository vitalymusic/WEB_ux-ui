<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            font-size: 16px;
            /* Sākotnējo atkāpju atiestatīšana */
        }

        .container {
            display: flex;
            width: 65%;
            margin: auto;
            gap: 50px;
        }



        .team img {
            width: 100%;
        }

        .team p {
            padding: 10px;
            text-align: center;
        }

        .team h3 {
            /* padding: 10px; */
            text-align: center;
            font-size: 2rem;
        }

        .team h5 {
            /* padding: 10px; */
            text-align: center;
            font-size: 1.2rem;
        }

       .team .col {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 10px 10px rgba(128, 128, 128, 0.489);
            padding-bottom: 20px;
            /* margin:20px */
        }


        .background1 {
            position: absolute;
            width: 100%;
            height: 400px;
            background-color: #863EF4;
            top: 0px;
            z-index: -1;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
        }

        .big_title {
            font-size: 5rem;
            text-align: center;
            font-weight: 100;
            margin: 50px 0px;
            color: white;
        }






        .contacts{
            margin-top:150px;


            .image img{
                width: 100%;

            }
             .image{
                width: 40%;
             }

            .big_title{
                color: #863EF4;
                font-size: 2rem;
                font-weight: 900;
            }


            form{
                display: flex;
                flex-direction: column;

            }




        }
    </style>
</head>

<body>


    <section>
        <h1 class="big_title">Mūsu komanda</h1>
        <div class="container team">
            <div class="col">
                <img src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="">
                <p>Labs speciālists IT jomā</p>
                <h3>Jānis Baltiņš</h3>
                <h5>Direktors</h5>
            </div>
            <div class="col">
                <img src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="">
                <p>Labs speciālists IT jomā</p>
                <h3>Jānis Baltiņš</h3>
                <h5>Direktors</h5>
            </div>
            <div class="col">
                <img src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="">
                <p>Labs speciālists IT jomā</p>
                <h3>Jānis Baltiņš</h3>
                <h5>Direktors</h5>
            </div>
        </div>

    </section>


    <section class="contacts">
           
        <div class="container">
            <div class="col image">
                 <img src="https://img.freepik.com/free-photo/group-graphic-designers-using-digital-tablet_1170-772.jpg?semt=ais_hybrid&w=740&q=80" alt="">   
            </div>
            <div class="col">
                 <h1 class="big_title">Mūsu kontakti</h1>
                 <p>Šajā lapā atradīsiet mūsu kontaktformu</p>

                 <form action="" class="contactForm">
                    <input type="text" name="" id=""    placeholder="Jūsu vārds">
                    <input type="email" name="" id=""    placeholder="Jūsu ēpasts">
                    <textarea name="" id="" placeholder="Ziņa"></textarea>
                    <button type="submit">Nosūtīt ziņu</button>
                 </form>
            </div>

        </div>


    </section>

    <!-- Dizaina elementi -->
    <div class="background1"></div>

</body>

</html>
